name: Build plugin zip

# Every push to main rebuilds aam-wp-migration.zip.
# - Version bump in the plugin header  -> new permanent release  vX.Y  (version history)
# - Push without a bump                -> the current version's zip asset is replaced
# Stable download link (never changes):
#   https://github.com/amartadey/AAM-WP-Migration/releases/latest/download/aam-wp-migration.zip

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'

permissions:
  contents: write

concurrency:
  group: plugin-zip
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read plugin version
        id: meta
        run: |
          VERSION=$(php -r '$s=file_get_contents("aam-wp-migration.php"); preg_match("/^\s*\*\s*Version:\s*(.+)$/mi",$s,$m); echo trim($m[1]);')
          CONST=$(php -r '$s=file_get_contents("constants.php"); preg_match("/AI1WM_VERSION.,\s*.([0-9.]+)/",$s,$m); echo $m[1];')
          if [ -z "$VERSION" ]; then echo "Could not read Version header"; exit 1; fi
          if [ "$VERSION" != "$CONST" ]; then
            echo "::error::Version mismatch - header Version: $VERSION but constants.php AI1WM_VERSION: $CONST. Bump both."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $VERSION"

      - name: Build aam-wp-migration.zip
        run: git archive --format=zip --prefix=aam-wp-migration/ -o aam-wp-migration.zip HEAD

      - name: Publish / refresh release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.meta.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists - replacing zip"
            gh release upload "$TAG" aam-wp-migration.zip --clobber
          else
            echo "Creating release $TAG"
            gh release create "$TAG" aam-wp-migration.zip \
              --title "$TAG" \
              --notes "Automated build from ${{ github.sha }}"
          fi
          gh release edit "$TAG" --latest
